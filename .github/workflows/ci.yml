name: CI
on: [push, pull_request]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # 1.5.0 is the currently-supported version and must pass. 1.12 also spins up, but is
    # allowed to fail for now (codebase still uses 1.5-era patterns) so it doesn't block PRs.
    # Remove this line to make 1.12 a required check once the codebase supports it.
    continue-on-error: ${{ matrix.version == '1.12' }}
    strategy:
      fail-fast: false
      matrix:
        version:
            - '1.5.0'
            - '1.12'
        arch:
            - x64
        os:
            - ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/julia-buildpkg@v1
      - name: "Run ci_tester.jl"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: julia --project=. --color=yes --code-coverage=user -e 'using Pkg; Pkg.instantiate(); include("test/ci_tester.jl")'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v1
